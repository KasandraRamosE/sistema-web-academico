services:
  mysql:
    image: mysql:8.0
    container_name: fhce_mysql
    # Variables de entorno que MySQL usa al inicializarse
    environment:
      MYSQL_ROOT_PASSWORD: root1234      
      MYSQL_DATABASE: sistema_cursos_fhce 
      MYSQL_USER: fhce_user             
      MYSQL_PASSWORD: fhce_pass       
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    # Volumen gestionado por Docker — persiste aunque el contenedor se elimine
services:

  # ─────────────────────────────────────────
  # 1. BASE DE DATOS — MySQL 8.0
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fhce_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sistema_cursos_fhce
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fhce_network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 2. BACKEND — Spring Boot
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend/sistema-cursos
      dockerfile: Dockerfile
    container_name: fhce_backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sistema_cursos_fhce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Email
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}     
      LIBELULA_APPKEY: ${LIBELULA_APPKEY:-}
      LIBELULA_CALLBACK_BASE_URL: ${LIBELULA_CALLBACK_BASE_URL:-}
      MOCK_LIBELULA_PAGO: ${MOCK_LIBELULA_PAGO:-false}
    volumes:
      - ./data/certificados:/app/certificados
      - ./data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy  
    networks:
      - fhce_network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 3. FRONTEND — Vue 3 + Nginx
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: fhce_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fhce_network
    restart: unless-stopped

# ─────────────────────────────────────────
# VOLÚMENES Y REDES
# ─────────────────────────────────────────
volumes:
  mysql_data:
    # Volumen gestionado por Docker — los datos viven en el host de Ubuntu

networks:
  fhce_network:
    # Red interna — los contenedores se comunican por nombre (mysql, backend, frontend)
    # Desde afuera solo es accesible el puerto 80 del frontend
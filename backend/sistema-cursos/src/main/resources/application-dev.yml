spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sistema_cursos_fhce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz
    # Por defecto coincide con backend/sistema-cursos/docker-compose.yml (MySQL local
    # de desarrollo). Si tu contenedor usa otras credenciales, seteá DEV_DB_USERNAME/
    # DEV_DB_PASSWORD en tu entorno en vez de hardcodear un valor real acá.
    username: ${DEV_DB_USERNAME:fhce_user}
    password: ${DEV_DB_PASSWORD:fhce_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    # Sin credenciales reales committeadas: para probar envío de emails en
    # dev, setear DEV_MAIL_USERNAME/DEV_MAIL_PASSWORD en tu entorno local
    # (ej. en un .env sin trackear, nunca en este archivo).
    username: ${DEV_MAIL_USERNAME:}
    password: ${DEV_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
# En dev: mostrar SQL y usar mocks
logging:
  level:
    bo.edu.umsa.fhce: DEBUG        # logs detallados de nuestro código
    org.hibernate.SQL: DEBUG       # queries SQL
    org.hibernate.type: TRACE     # valores de parámetros en las queries

# Indicador del perfil activo (útil para saber qué mock está cargado)
app:
  mocks:
    umsa-auth: true     # UmsaAuthClient usará implementación mock
  email:
    # URL base para links en emails (en prod cambiar al dominio real)
    base-url: "http://localhost:5173"


# ============================================================
# application-prod.yml
# Ubicación: backend/sistema-cursos/src/main/resources/
# Se activa con: -Dspring.profiles.active=prod
# Todos los valores sensibles vienen de variables de entorno
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool de conexiones — ajustar según carga esperada
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  cors:
    # SIN default a propósito: si no se configura ALLOWED_ORIGINS, el
    # backend arranca igual pero rechaza todo request cross-origin (falla
    # cerrado). Configurar con el dominio real una vez desplegado, ej.:
    # ALLOWED_ORIGINS=https://cursos.fhce.umsa.bo
    allowed-origins: ${ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    # false por defecto a propósito: hoy se sirve por HTTP plano (sin TLS).
    # Cuando se agregue HTTPS, poner COOKIE_SECURE=true — si no, el navegador
    # jamás va a mandar la cookie sobre HTTP y el login/refresh fallaría.
    cookie-secure: ${COOKIE_SECURE:false}
  mocks:
    # Sin acceso real a la API de UMSA todavía: en lugar del mock (que acepta
    # cualquier RU con "test123"), se usa DisabledUmsaAuthClient, que responde
    # "servicio no disponible" de forma limpia. Cuando llegue el acceso real,
    # se agrega un UmsaAuthClient real (mismo patrón que RealLibelulaClient)
    # y esta bandera deja de ser necesaria.
    umsa-auth: false
  email:
    base-url: ${APP_BASE_URL}
  libelula:
    # Vacíos hasta que UMSA/FHCE reciba el appkey real de Libélula.
    # RealLibelulaClient responde 503 mientras tanto (no falla el arranque).
    appkey: ${LIBELULA_APPKEY:}
    base-url: https://api.libelula.bo
    # URL pública del backend donde Libélula avisa los pagos. Debe apuntar
    # al dominio real una vez desplegado (ej. https://cursos.fhce.umsa.bo/api).
    callback-base-url: ${LIBELULA_CALLBACK_BASE_URL:}
  # Ruta relativa al directorio de trabajo del contenedor (/app)
  # Los volúmenes de Docker montan las carpetas reales ahí
  certificados:
    directorio: /app/certificados
  archivos:
    directorio: /app/uploads
  # La ruta del logo ahora es relativa — no más rutas de Windows
  reportes:
    logo: /app/uploads/logo.jpg

logging:
  level:
    bo.edu.umsa.fhce: INFO
    org.springframework.security: WARN
  file:
    name: /app/logs/sistema-cursos.log